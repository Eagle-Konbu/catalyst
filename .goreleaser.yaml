# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: catalyst

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: catalyst
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: catalyst
    repository:
      owner: Eagle-Konbu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Eagle-Konbu/catalyst"
    description: "CLI tool for controlling Nature Remo devices"
    license: "MIT"
    install: |
      bin.install "catalyst"
    test: |
      system "#{bin}/catalyst", "--help"
